name: Assemble index.html

# index.html 很大（65KB），而推送通道单次上限约 8KB，所以拆成 8 块存在 _tmp/。
# 这个 workflow 把它们按顺序用换行拼回去，覆盖 personal-site/app/index.html，
# 校验字节数后自动删除 _tmp/ 并提交。
on:
  push:
    paths:
      - "_tmp/blk*.part"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拼装并校验
        run: |
          python3 - <<'PY'
import glob, re, sys

blocks = sorted(
    glob.glob('_tmp/blk*.part'),
    key=lambda p: int(re.search(r'blk(\d+)', p).group(1)),
)
print('找到分块:', blocks)
if len(blocks) != 8:
    sys.exit(f'期望 8 块，实际 {len(blocks)}')

parts = [open(p, encoding='utf-8').read() for p in blocks]
for p, t in zip(blocks, parts):
    print(f'  {p}: {len(t.encode())} B')

# 末块自带文件结尾换行，块之间用单个换行连接
out = '\n'.join(parts)
data = out.encode('utf-8')
print('拼装后字节数:', len(data))

# 行数或字节数偏小就说明有块缺失/损坏，拒绝写入
if len(data) < 60000:
    sys.exit(f'太小了：{len(data)}，拒绝写入')
for needle in ('const API_BASE', 'const USE_MOCK', '</html>'):
    if needle not in out:
        sys.exit(f'缺少关键标识：{needle}')

open('personal-site/app/index.html', 'w', encoding='utf-8', newline='').write(out)
print('已写入 personal-site/app/index.html')
PY

      - name: 提交并清理分块
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf _tmp
          git add -A personal-site/app/index.html _tmp
          git commit -m "feat(app): 拼装出完整 index.html，清理 _tmp 分块" || echo "无变更"
          git push
