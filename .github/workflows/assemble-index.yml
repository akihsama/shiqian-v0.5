name: Assemble index.html

# index.html 约 65KB，超出推送通道的无损上限（越大越容易被改写个别汉字），
# 因此拆成 45 片存在 _p2/ 下（每片 ≤1.7KB，已逐字节校验）。
# 本 workflow 调用 scripts/assemble_index.py 拼回并覆盖 personal-site/app/index.html。
on:
  push:
    paths:
      - "_p2/**"
      - "scripts/assemble_index.py"
      - ".github/workflows/assemble-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify
        run: python3 scripts/assemble_index.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal-site/app/index.html
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "build(app): 由 _p2/ 分片拼装 index.html（65277 字节）"
            git push origin HEAD:main
          fi
