<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今日食签 · 每日吃什么</title>
<link rel="stylesheet" href="css/platform.css">
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
  --font-xingkai: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', sans-serif;

    /* 亮色主题默认值 */
    --bg-gradient-start: #E0F7FA;
    --bg-gradient-mid: #B2EBF2;
    --bg-gradient-end: #80DEEA;
    
    --text-primary: #1A237E;
    --text-secondary: #00BCD4;
    --text-muted: #90A4AE;
    
    --container-bg: rgba(255, 255, 255, 0.6);
    --container-border: rgba(79, 195, 247, 0.2);
    --item-bg: rgba(224, 247, 250, 0.8);
    
    --wood-light: #8D6E63;
    --wood-mid: #6D4C41;
    --wood-dark: #5D4037;
    --wood-darker: #4E342E;
    
    --gold: #FFD54F;
    --red-accent: #E53935;
    --btn-gradient-start: #4FC3F7;
    --btn-gradient-end: #00BCD4;
    --shadow-color: rgba(0, 0, 0, 0.1);
    --glow-color: rgba(79, 195, 247, 0.4);
    
    --cloud-opacity: 0.3;
    --card-bg-start: #FFF8E1;
    --card-bg-end: #FFE082;
    --card-text: #5D4037;
  }

  /* 暗色主题覆盖 */
  html[data-theme="dark"] {
      --bg-gradient-start: #0f172a;
      --bg-gradient-mid: #1e293b;
      --bg-gradient-end: #334155;
      
      --text-primary: #e2e8f0;
      --text-secondary: #38bdf8;
      --text-muted: #94a3b8;
      
      --container-bg: rgba(30, 41, 59, 0.7);
      --container-border: rgba(56, 189, 248, 0.2);
      --item-bg: rgba(51, 65, 85, 0.6);
      
      --wood-light: #5D4037;
      --wood-mid: #4E342E;
      --wood-dark: #3E2723;
      --wood-darker: #281815;
      
      --gold: #fbbf24;
      --red-accent: #f87171;
      --btn-gradient-start: #0ea5e9;
      --btn-gradient-end: #0284c7;
      --shadow-color: rgba(0, 0, 0, 0.4);
      --glow-color: rgba(14, 165, 233, 0.5);
      
      --cloud-opacity: 0.1;
      --card-bg-start: #451a03;
      --card-bg-end: #78350f;
      --card-text: #fef3c7;
  }

  body {
    font-family: var(--font-xingkai);
    background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 40%, var(--bg-gradient-end) 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    color: var(--text-primary);
    transition: background 0.5s ease;
  }

  /* ===== 深浅色切换按钮 ===== */
  /* wallpaper background */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
   background-image: url("../assets/img/wallpaper.png");
    background-size: cover;
    background-position: center;
    filter: blur(2px) brightness(0.85);
    opacity: 0.6;
    z-index: -2;
    pointer-events: none;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(0.5px);
    z-index: -1;
    pointer-events: none;
  }

  .theme-toggle {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 50;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--container-border);
    background: var(--container-bg);
    color: var(--text-primary);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow-color);
    transition: transform 0.2s ease, background 0.3s ease;
  }
  .theme-toggle:hover { transform: scale(1.08); }

  button,
  input,
  textarea,
  select {
    font-family: var(--font-xingkai);
